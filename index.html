<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Pubertät & Zyklus – Lern-App</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&family=Nunito:wght@400..900&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root {
  --font-display: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif;
  --font-body: 'Nunito', 'Segoe UI', system-ui, Helvetica, Arial, sans-serif;
  --font-mono: 'JetBrains Mono', 'SFMono-Regular', Menlo, monospace;
  --text-xs: .75rem; --text-sm: .875rem; --text-base: 1rem; --text-md: 1.125rem; --text-lg: 1.375rem; --text-xl: 1.75rem; --text-2xl: 2.25rem; --text-3xl: 3rem;
  --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 24px; --space-6: 32px; --space-7: 48px;
  --radius-md: 16px;
  --pop-yellow: #fed835; --pop-pink: #fb55b1; --pop-cyan: #36dcec; --pop-green: #49de78; --ink: #161332;
  --st-1: #fc65b6; --st-2: #ff8f31; --st-3: #edd643; --st-4: #4cd676; --st-5: #43cae7; --st-6: #ae8bff; --st-7: #ff7a7a; --st-8: #7fd3c4;
  --bg: #f3f4ff; --surface: #fdfdff; --subtle: #e6e7ff; --text: #181535; --muted: #4a486d; --line: #1f174a; --line-soft: #babadd;
  --primary: #6442e4; --on-primary: #fbfbff; --accent-text: #502cbe; --accent-bg: #e3e4ff;
  --good: #005928; --good-bg: #c1f7d2; --bad: #a90017; --bad-bg: #ffdfda; --warn: #784000; --warn-bg: #ffeea0;
  --header-bg: #2f127b; --header-text: #fbfbff; --header-muted: #ccccf8; --header-line: #6358ba;
  --bar-track: #d4d4f5; --bar-fill: #745af4; --xp: var(--pop-yellow);
  --c-fsh: #2f7de1; --c-lh: #e08a00; --c-oe: #d7263d; --c-pr: #1d8a4a; --c-sh: #e86aa0;
  --organ: #f6c3c9; --organ2: #ef8f9d; --organ3: #f8dfb8; --organ4: #c9d7f5;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #120e2d; --surface: #1f1a43; --subtle: #181439; --text: #f4f4fd; --muted: #c0c0e4; --line: #9d99ed; --line-soft: #3e3a70;
    --primary: #a89fff; --on-primary: #141030; --accent-text: #c9c6ff; --accent-bg: #2d2560;
    --good: #5eee9c; --good-bg: #00361a; --bad: #ffa59c; --bad-bg: #4f1a18; --warn: #f6da6f; --warn-bg: #3e2e00;
    --header-bg: #0a0427; --bar-track: #373267; --bar-fill: #aea5ff;
    --c-fsh: #7fb4ff; --c-lh: #ffbe55; --c-oe: #ff7b8b; --c-pr: #5fd98f; --c-sh: #ff9cc6;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #120e2d; --surface: #1f1a43; --subtle: #181439; --text: #f4f4fd; --muted: #c0c0e4; --line: #9d99ed; --line-soft: #3e3a70;
  --primary: #a89fff; --on-primary: #141030; --accent-text: #c9c6ff; --accent-bg: #2d2560;
  --good: #5eee9c; --good-bg: #00361a; --bad: #ffa59c; --bad-bg: #4f1a18; --warn: #f6da6f; --warn-bg: #3e2e00;
  --header-bg: #0a0427; --bar-track: #373267; --bar-fill: #aea5ff;
  --c-fsh: #7fb4ff; --c-lh: #ffbe55; --c-oe: #ff7b8b; --c-pr: #5fd98f; --c-sh: #ff9cc6;
}
:root { box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: var(--text-md); font-weight: 500; line-height: 1.45; min-height: 100vh; }
h1, h2, h3, p { margin: 0; }
.mono { font-family: var(--font-mono); }
.b { font-weight: 800; }
.small { font-size: var(--text-sm); color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.wrap { max-width: 720px; margin: 0 auto; padding: var(--space-5) var(--space-4) var(--space-7); }
.tag { font-size: var(--text-xs); font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--accent-text); }
.tag.inv { color: var(--header-muted); }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }

/* Kopf */
.top { position: relative; overflow: hidden; color: var(--header-text); padding: var(--space-4) var(--space-4) var(--space-5); border-bottom: 4px solid var(--line);
  background: radial-gradient(circle at 88% 18%, rgba(165,0,145,.55), transparent 42%), radial-gradient(circle at 6% 92%, rgba(0,131,199,.5), transparent 46%), var(--header-bg); }
.top > * { max-width: 688px; margin-left: auto; margin-right: auto; position: relative; z-index: 1; }
.top > .spark { position: absolute; z-index: 0; max-width: none; margin: 0; left: var(--x); top: var(--y); width: var(--s); height: var(--s); border-radius: 50%; background: var(--c); opacity: .55; animation: drift var(--t) ease-in-out infinite alternate; }
@keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(22px,-26px) scale(1.35); } }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); margin-bottom: var(--space-5); }
.logochip { background: #fff; border-radius: var(--radius-md); padding: 6px 10px; display: flex; border: 3px solid var(--line); box-shadow: 0 3px 0 var(--line); }
.logochip img { height: 30px; width: auto; display: block; }
.hero { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); }
.herotxt { min-width: 0; }
.top h1 { font-family: var(--font-display); font-weight: 700; font-size: 2.6rem; line-height: 1.02; text-shadow: 0 3px 0 #150640; }
.lead { color: var(--header-muted); font-size: var(--text-md); margin-top: var(--space-2); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-2); margin-top: var(--space-5); }
.stat { border: 3px solid var(--header-line); border-radius: 14px; background: rgba(255,255,255,.08); padding: var(--space-3); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat .k { font-size: var(--text-xs); font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--header-muted); }
.stat .v { font-family: var(--font-display); font-weight: 600; font-size: var(--text-base); line-height: 1.15; overflow-wrap: break-word; hyphens: auto; }
.stat:nth-child(2) .v { color: var(--pop-yellow); }
.stat .s { font-size: var(--text-xs); color: var(--header-muted); }
.xpbar { height: 16px; border-radius: 8px; margin-top: var(--space-4); overflow: hidden; border: 3px solid var(--header-line); background: #150a3c; }
.xpbar > div { height: 100%; background: var(--xp); border-radius: 6px; transition: width .9s cubic-bezier(.3,.8,.3,1); position: relative; overflow: hidden; }
.xpbar > div::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.5), transparent); transform: translateX(-100%); animation: shine 2.4s ease-in-out infinite; }
@keyframes shine { to { transform: translateX(100%); } }
.xpbar.light { height: 14px; border-color: var(--line); background: var(--bar-track); margin: var(--space-3) 0 var(--space-4); }
.xpbar.light > div { background: var(--sc, var(--bar-fill)); transition: width .35s ease; }
.bubble { display: none; margin-top: var(--space-2); background: var(--pop-yellow); color: var(--ink); border: 3px solid var(--line); border-radius: 14px; padding: 8px 12px; font-weight: 800; font-size: var(--text-sm); }
.bubble.show { display: inline-block; animation: pop .35s both; }
.wbtn { appearance: none; background: none; border: 0; padding: 4px; cursor: pointer; flex: none; }

/* Karten, Knöpfe */
.card { background: var(--surface); border: 3px solid var(--line); border-radius: var(--radius-md); padding: var(--space-4); box-shadow: 0 5px 0 var(--line); }
.btn { appearance: none; min-height: 52px; padding: 0 var(--space-5); border: 3px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--text); font: 800 var(--text-md)/1.1 var(--font-body); cursor: pointer; box-shadow: 0 4px 0 var(--line); transition: transform .08s ease, box-shadow .08s ease, filter .15s; }
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.btn:disabled { opacity: .4; cursor: default; box-shadow: none; transform: none; }
.btn-primary { background: var(--primary); color: var(--on-primary); }
.btn.sm { min-height: 40px; padding: 0 var(--space-3); font-size: var(--text-sm); box-shadow: 0 3px 0 var(--line); }
.btn.block { display: block; width: 100%; margin-top: var(--space-3); }
.btn.on { background: var(--primary); color: var(--on-primary); }
.btn.nudge { animation: nudge 1.7s ease-in-out infinite; }
@keyframes nudge { 0%,100% { box-shadow: 0 4px 0 var(--line), 0 0 0 0 var(--pop-yellow); } 50% { box-shadow: 0 4px 0 var(--line), 0 0 0 9px rgba(254,216,53,0); } }
.linkbtn { appearance: none; background: none; border: 0; padding: 0; color: inherit; font: inherit; text-decoration: underline; cursor: pointer; }

/* Lernpfad */
.row { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); margin: var(--space-4) 0 var(--space-3); }
.row h2, .sumh { font-family: var(--font-display); font-weight: 600; font-size: var(--text-xl); line-height: 1.15; }
.path { display: flex; flex-direction: column; gap: var(--space-3); }
.section-h { font-family: var(--font-display); font-weight: 600; font-size: var(--text-lg); margin: var(--space-4) 0 0; display: flex; align-items: center; gap: var(--space-2); }
.section-h .pill { font-family: var(--font-body); font-size: var(--text-xs); font-weight: 800; letter-spacing: .08em; text-transform: uppercase; background: var(--pop-yellow); color: var(--ink); border: 2px solid var(--line); border-radius: 999px; padding: 2px 10px; }
.st { display: grid; grid-template-columns: 50px 1fr; grid-template-areas: "num body" "act act"; gap: var(--space-3); align-items: start; }
.st .num { grid-area: num; width: 50px; height: 50px; border-radius: 14px; background: var(--sc); color: var(--ink); border: 3px solid var(--line); display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 700; font-size: var(--text-xl); box-shadow: 0 3px 0 var(--line); }
.st .stbody { grid-area: body; min-width: 0; }
.st h3, .review h3 { font-family: var(--font-display); font-weight: 600; font-size: var(--text-lg); line-height: 1.2; }
.sub { font-size: var(--text-sm); color: var(--accent-text); margin-top: 2px; font-weight: 700; }
.mast { display: flex; gap: 4px; margin-top: var(--space-3); }
.seg { height: 10px; flex: 1; border-radius: 5px; background: var(--bar-track); }
.seg.on { background: var(--sc, var(--bar-fill)); }
.starsrow { display: flex; align-items: center; gap: var(--space-3); margin-top: var(--space-2); flex-wrap: wrap; }
.stars { font-size: var(--text-xl); color: var(--pop-yellow); -webkit-text-stroke: 1.5px var(--line); letter-spacing: 2px; }
.st.locked { border-style: dashed; border-color: var(--line-soft); background: var(--subtle); box-shadow: none; }
.st.locked .num { background: var(--line-soft); color: var(--muted); box-shadow: none; }
.st.locked h3 { color: var(--muted); }
.lock { grid-area: act; text-align: center; padding: var(--space-2); font-weight: 700; }
.acts { grid-area: act; display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); }
.acts .btn { width: 100%; padding: 0 var(--space-3); }
.review { display: grid; gap: var(--space-3); background: var(--accent-bg); }
.review > .btn { width: 100%; }
.review p { margin-top: var(--space-1); }
.intro { background: var(--pop-yellow); color: var(--ink); }
.intro .tag, .intro .small { color: var(--ink); }
.intro p { margin-top: 6px; }
.intro .btn { color: var(--text); }
.foot { margin-top: var(--space-6); padding-top: var(--space-4); border-top: 2px solid var(--line); display: flex; flex-direction: column; gap: var(--space-3); align-items: flex-start; }
.chal { background: var(--subtle); }
.chal h3 { font-family: var(--font-display); font-weight: 600; font-size: var(--text-lg); margin: 4px 0 6px; }
.ansrow { display: flex; align-items: stretch; gap: var(--space-3); margin-top: var(--space-3); }
.numin { flex: 1; min-width: 0; min-height: 52px; padding: 0 var(--space-4); border: 3px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--text); font-size: var(--text-lg); font-weight: 700; text-transform: uppercase; }
.errtxt { color: var(--bad); font-weight: 700; font-size: var(--text-sm); margin-top: 4px; }
.chlist { margin: var(--space-3) 0 0; padding-left: 20px; font-size: var(--text-sm); }
.nickrow { margin-top: var(--space-3); display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
.resline { border: 2px dashed var(--line); border-radius: var(--radius-md); padding: var(--space-3); margin: var(--space-3) 0 var(--space-2); font-size: var(--text-sm); overflow-wrap: anywhere; user-select: all; }

/* Geschlechtswahl */
.choose { min-height: 100vh; display: flex; align-items: center; }
.choose .card { text-align: left; }
.choose h1 { font-family: var(--font-display); font-weight: 700; font-size: var(--text-2xl); line-height: 1.1; margin: 6px 0 10px; }
.sexbtns { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); margin: var(--space-5) 0 var(--space-3); }
.sexbtn { appearance: none; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: var(--space-5) var(--space-3); border: 3px solid var(--line); border-radius: 18px; background: var(--surface); color: var(--text); font: 800 var(--text-lg)/1.1 var(--font-display); cursor: pointer; box-shadow: 0 5px 0 var(--line); transition: transform .1s, box-shadow .1s; }
.sexbtn:hover { transform: translateY(-2px); box-shadow: 0 7px 0 var(--line); }
.sexbtn .sym { width: 64px; height: 64px; }
.sexbtn small { font: 600 var(--text-xs)/1.3 var(--font-body); color: var(--muted); }

/* Runde */
.round { padding-top: var(--space-4); }
.rtop { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); }
.qcard { padding: var(--space-5) var(--space-4); border-top: 12px solid var(--sc, var(--primary)); position: relative; }
.round .qcard { margin-top: 38px; }
.tags { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; margin-bottom: var(--space-3); }
.badge { font-size: var(--text-xs); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 8px; background: var(--text); color: var(--bg); }
.badge.warn { background: var(--warn-bg); color: var(--warn); outline: 1px solid var(--warn); }
.badge.own { background: var(--pop-yellow); color: var(--ink); outline: 2px solid var(--line); }
.q { font-weight: 800; font-size: var(--text-lg); line-height: 1.3; margin-bottom: var(--space-4); }
.opts { display: flex; flex-direction: column; gap: var(--space-3); }
.opt { appearance: none; display: flex; align-items: flex-start; gap: var(--space-3); text-align: left; width: 100%; min-height: 56px; padding: var(--space-3) var(--space-4); border: 3px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--text); font: 600 var(--text-md)/1.35 var(--font-body); cursor: pointer; box-shadow: 0 4px 0 var(--line-soft); transition: transform .1s, box-shadow .1s, background .15s; }
.opt:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 0 var(--line-soft); }
.opt .ltr { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--line); background: var(--sc, var(--primary)); color: var(--ink); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: var(--text-sm); }
.opt:disabled { cursor: default; opacity: .75; }
.opt.good { opacity: 1; background: var(--good-bg); border-color: var(--good); color: var(--good); box-shadow: 0 4px 0 currentColor; animation: pulse .5s; }
.opt.good .ltr { background: var(--good); color: var(--good-bg); border-color: var(--good); }
.opt.bad { opacity: 1; background: var(--bad-bg); border-color: var(--bad); color: var(--bad); box-shadow: 0 4px 0 currentColor; animation: shake .45s; }
.opt.bad .ltr { background: var(--bad); color: var(--bad-bg); border-color: var(--bad); }
.tfopts { flex-direction: row; }
.tfopts .opt { justify-content: center; }
.fb { margin-top: var(--space-4); border: 3px solid; border-radius: 14px; padding: var(--space-4); position: relative; animation: pop .3s both; }
.fb .fbt { font-weight: 800; margin-bottom: var(--space-1); color: inherit; }
.fb .fbb { font-size: var(--text-base); line-height: 1.5; color: var(--text); }
.fb.good { background: var(--good-bg); border-color: var(--good); color: var(--good); }
.fb.bad { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.fb.warn { background: var(--warn-bg); border-color: var(--warn); color: var(--warn); }
.fbx { margin-top: var(--space-3); }
.xppop { position: absolute; right: 14px; top: -18px; background: var(--pop-yellow); color: var(--ink); border: 3px solid var(--line); border-radius: 999px; padding: 2px 12px; font-family: var(--font-display); font-weight: 700; animation: xpfloat 1.3s ease-out both; }
@keyframes xpfloat { 0% { opacity: 0; transform: translateY(18px) scale(.5); } 30% { opacity: 1; transform: translateY(-8px) scale(1.15); } 100% { opacity: 1; transform: translateY(-4px) scale(1); } }

/* Reihenfolge */
.ordlist { list-style: none; margin: 0 0 var(--space-3); padding: 0; counter-reset: o; display: flex; flex-direction: column; gap: 6px; }
.ordlist li { counter-increment: o; display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: center; padding: 8px 12px; border: 3px solid var(--line); border-radius: 14px; background: var(--accent-bg); font-weight: 700; animation: pop .25s both; }
.ordlist li::before { content: counter(o); width: 30px; height: 30px; border-radius: 50%; background: var(--sc, var(--primary)); color: var(--ink); border: 3px solid var(--line); display: flex; align-items: center; justify-content: center; font-weight: 800; }
.ordlist li.ph { border-style: dashed; border-color: var(--line-soft); background: transparent; color: var(--muted); font-weight: 600; animation: none; }
.ordlist li.ok { background: var(--good-bg); color: var(--good); border-color: var(--good); }
.ordlist li.no { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }
.chips { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-bottom: var(--space-3); }

/* Lektion */
.lh { font-family: var(--font-display); font-weight: 600; font-size: var(--text-xl); line-height: 1.2; margin-bottom: var(--space-3); }
.lbody p, .lbody ul, .lbody table { margin: 0 0 12px; }
.lbody ul { padding-left: 22px; }
.lbody li { margin: 4px 0; }
.lcard h3.q { margin-top: 20px; }
.dots { display: flex; gap: 6px; margin: 12px 0; }
.dot { flex: 1; height: 10px; border-radius: 5px; background: var(--bar-track); transition: background .3s; }
.dot.on { background: var(--sc, var(--bar-fill)); }
.navrow { display: grid; grid-template-columns: 1fr 2fr; gap: var(--space-3); margin-top: var(--space-4); }
.simhost { margin-top: var(--space-2); }
.merk { display: flex; gap: var(--space-3); align-items: flex-start; border: 3px solid var(--primary); background: var(--accent-bg); border-radius: 14px; padding: var(--space-3); margin: var(--space-3) 0; }
.mk { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--pop-yellow); color: var(--ink); border: 3px solid var(--line); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: var(--text-sm); }
.merk.warn { border-color: var(--warn); background: var(--warn-bg); }
.merk.warn .mk { background: var(--pop-pink); }
.merk.you { border-color: var(--line); background: var(--pop-yellow); color: var(--ink); }
.goals { background: var(--accent-bg); border: 3px solid var(--line); border-radius: 14px; padding: var(--space-3); margin-bottom: var(--space-3); }
.goals ul { margin: var(--space-1) 0 0; padding-left: 20px; }
.tbl { width: 100%; border-collapse: collapse; font-size: var(--text-sm); }
.tbl th, .tbl td { text-align: left; padding: 8px 6px; border-top: 2px solid var(--line-soft); vertical-align: top; }
.tbl thead th { border-top: none; font-size: var(--text-xs); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.tbl tbody th { font-weight: 800; }
.tscroll { overflow-x: auto; }

/* Simulationen */
.sim { border: 3px solid var(--line-soft); border-radius: 14px; padding: var(--space-3); background: var(--subtle); }
.sl { display: block; margin-top: var(--space-3); }
.sll { display: block; font-weight: 700; font-size: var(--text-sm); margin-bottom: 2px; }
input[type=range] { width: 100%; height: 36px; margin: 0; accent-color: var(--primary); }
.readout { font-size: var(--text-sm); line-height: 1.6; background: var(--surface); border: 3px solid var(--line-soft); border-radius: 14px; padding: var(--space-3); margin-top: var(--space-3); }
.seg3 { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-bottom: var(--space-3); }
.fig { display: block; width: 100%; height: auto; max-height: 320px; background: var(--surface); border: 3px solid var(--line-soft); border-radius: 14px; margin-bottom: var(--space-3); }
.fig .o { stroke: var(--line); stroke-width: 2; }
.fig .skin { fill: #f3d6c4; stroke: var(--line); stroke-width: 2; }
.fig .tube { fill: none; stroke: var(--organ2); stroke-width: 8; stroke-linecap: round; }
.fig .duct { fill: none; stroke: #8d86c9; stroke-width: 5; stroke-linecap: round; }
.fig .ure { fill: none; stroke: #e2b100; stroke-width: 4; stroke-linecap: round; }
.fig .thin { fill: none; stroke: var(--line); stroke-width: 2.5; stroke-linecap: round; }
.fig .hs circle.d { fill: var(--pop-yellow); stroke: var(--ink); stroke-width: 2.5; }
.fig .hs text { font: 800 11px var(--font-body); fill: var(--ink); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.fig .hs { cursor: pointer; }
.fig .hs.on circle.d { fill: var(--pop-pink); }
.fig .ring { fill: none; stroke: var(--pop-pink); stroke-width: 4; animation: ring 1.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes ring { 0% { transform: scale(.6); opacity: 1; } 100% { transform: scale(1.8); opacity: 0; } }
.fig .lbl { font: 700 10px var(--font-body); fill: var(--muted); }
.fig .axis { stroke: var(--line-soft); stroke-width: 1.5; }
.fig .curve { fill: none; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: var(--text-sm); font-weight: 700; margin-bottom: var(--space-2); }
.legend span::before { content: ""; display: inline-block; width: 14px; height: 4px; border-radius: 2px; background: var(--c); margin-right: 6px; vertical-align: middle; }
.phase { font-weight: 700; padding: 10px 12px; border: 3px solid var(--line); border-radius: 14px; background: var(--accent-bg); margin-top: var(--space-3); }
.chk { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: var(--text-sm); margin-top: var(--space-3); cursor: pointer; }
.chk input { width: 22px; height: 22px; accent-color: var(--primary); }
.tl { position: relative; margin-top: var(--space-2); }
.tlrow { display: grid; grid-template-columns: 9.5rem 1fr; gap: var(--space-2); align-items: center; margin: 6px 0; font-size: var(--text-sm); font-weight: 700; }
.tltrack { position: relative; height: 18px; background: var(--surface); border: 2px solid var(--line-soft); border-radius: 9px; }
.tlbar { position: absolute; top: 2px; bottom: 2px; border-radius: 6px; background: var(--sc, var(--bar-fill)); opacity: .45; transition: opacity .3s; }
.tlrow.now .tlbar { opacity: 1; }
.tlrow.now { color: var(--accent-text); }
.tlcur { position: absolute; top: -4px; bottom: -4px; width: 3px; background: var(--bad); border-radius: 2px; transition: left .25s; }
.tlscale { display: grid; grid-template-columns: 9.5rem 1fr; gap: var(--space-2); font-size: var(--text-xs); color: var(--muted); }
.tlscale div:last-child { display: flex; justify-content: space-between; }
.bigcount { font-family: var(--font-display); font-weight: 700; font-size: var(--text-2xl); line-height: 1.1; }
.btrack { display: block; height: 16px; background: var(--bar-track); border-radius: 8px; overflow: hidden; margin: var(--space-2) 0; }
.bfill { display: block; height: 100%; background: var(--sc, var(--bar-fill)); border-radius: 8px; transition: width .6s cubic-bezier(.3,.8,.3,1); }
.hurdles { list-style: none; padding: 0; margin: var(--space-3) 0 0; display: flex; flex-direction: column; gap: 6px; }
.hurdles li { padding: 8px 12px; border: 2px solid var(--line-soft); border-radius: 12px; background: var(--surface); font-size: var(--text-sm); }
.hurdles li.done { border-color: var(--line); }
.hurdles li.cur { border-color: var(--line); background: var(--pop-yellow); color: var(--ink); font-weight: 700; animation: pop .3s both; }
.xyrow { display: flex; align-items: center; justify-content: center; gap: var(--space-3); margin: var(--space-3) 0; font-family: var(--font-display); font-weight: 700; font-size: var(--text-xl); flex-wrap: wrap; }
.cell { display: flex; align-items: center; justify-content: center; border: 3px solid var(--line); background: var(--organ3); color: var(--ink); border-radius: 50%; }
.cell.egg { width: 76px; height: 76px; }
.cell.sp { width: 40px; height: 40px; background: var(--organ4); }
.cell.zy { width: 84px; height: 84px; background: var(--pop-yellow); }

.bk h3 { font-family: var(--font-display); font-weight: 600; font-size: var(--text-lg); margin: 4px 0 6px; }
.bkdet { margin-top: 12px; }
.bkdet summary { cursor: pointer; font-weight: 800; font-size: var(--text-sm); }
.bkta { width: 100%; margin: 8px 0; border: 3px solid var(--line); border-radius: 14px; padding: 10px; background: var(--surface); color: var(--text); font: 500 var(--text-xs)/1.4 var(--font-mono); word-break: break-all; }
.okmsg { color: var(--good); font-weight: 700; margin-top: 8px; }
/* Abbildungen */
.yt { position: relative; aspect-ratio: 16 / 9; border: 3px solid var(--line); border-radius: 14px; overflow: hidden; background: #0f0b26; margin: var(--space-3) 0 0; }
.yt iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.ytload { appearance: none; position: absolute; inset: 0; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 12px; border: 0; cursor: pointer; color: #fbfbff; font: inherit; text-align: center;
  background: radial-gradient(circle at 80% 20%, rgba(165,0,145,.5), transparent 50%), radial-gradient(circle at 10% 90%, rgba(0,131,199,.45), transparent 50%), #2f127b; }
.ytload .small { color: #ccccf8; max-width: 26em; }
.ytplay { width: 64px; height: 46px; border-radius: 14px; background: #ff0033; display: flex; align-items: center; justify-content: center; font-size: 22px; border: 3px solid #fff; transition: transform .15s; }
.ytload:hover .ytplay { transform: scale(1.08); }
.wwlist { display: flex; flex-direction: column; gap: 8px; }
.wwbtn { display: flex; align-items: center; gap: 12px; text-decoration: none; min-height: 48px; padding: 6px 14px; font-size: var(--text-base); text-align: left; }
.ytplay.sm { width: 34px; height: 26px; border-radius: 8px; font-size: 12px; color: var(--on-primary); background: var(--primary); border: 2px solid var(--line); flex: none; }
.vidlink { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; margin-top: 4px; }
.pic { margin: var(--space-3) 0; background: #fff; border: 3px solid var(--line-soft); border-radius: 14px; padding: 8px; }
.pic img { display: block; width: 100%; height: auto; max-height: 460px; object-fit: contain; border-radius: 8px; }
.pic figcaption { font-size: var(--text-sm); color: #3c3a5c; margin-top: 6px; }
.pic .src { display: block; font-size: var(--text-xs); color: #6a688a; }
.legend2 { margin-top: 6px; color: #181535; }
.legend2 summary { cursor: pointer; font-weight: 800; font-size: var(--text-sm); padding: 4px 0; }
.legend2 ul { list-style: none; padding: 0; margin: 4px 0 0; columns: 2; column-gap: 16px; font-size: var(--text-sm); }
.legend2 li { margin: 2px 0; break-inside: avoid; }
.legend2 b { display: inline-block; min-width: 1.4em; font-family: var(--font-mono); }
.qcard .pic img { max-height: 380px; }
.flow { stroke-dasharray: 7 5; animation: flow .8s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -12; } }
.vib { animation: vib var(--sp) ease-in-out infinite alternate; transform-box: view-box; transform-origin: 120px 30px; }
.vib.r { animation-direction: alternate-reverse; }
@keyframes vib { from { transform: rotate(-1.5deg); } to { transform: rotate(1.5deg); } }

/* Ergebnis */
.summary .card { position: relative; overflow: hidden; padding-right: 96px; }
.summary .sumh { margin: var(--space-2) 0 var(--space-3); font-size: var(--text-2xl); }
.bigstars { font-size: var(--text-3xl); letter-spacing: 6px; line-height: 1; margin-bottom: var(--space-3); }
.bigstars span { display: inline-block; color: var(--line-soft); -webkit-text-stroke: 2px var(--line-soft); animation: starin .5s var(--d, 0ms) both; }
.bigstars span.on { color: var(--pop-yellow); -webkit-text-stroke: 2px var(--line); }
.lead2 { font-size: var(--text-lg); margin-bottom: var(--space-3); }
.gain { display: flex; align-items: baseline; gap: var(--space-3); margin-bottom: var(--space-2); }
.gain .b { font-size: var(--text-xl); color: var(--accent-text); }
.miss { margin-top: var(--space-4); padding-top: var(--space-3); border-top: 2px solid var(--line); }
.miss ul { margin: var(--space-2) 0 0; padding-left: var(--space-5); }
.sumw { position: absolute; right: 12px; top: 8px; }
.confetti { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
.confetti span { position: absolute; left: 50%; top: 30%; width: 9px; height: 14px; border-radius: 2px; animation: fly 1.3s ease-out both; }
.gloss dt { font-weight: 800; margin-top: 8px; }
.gloss dd { margin: 0 0 0 0; font-size: var(--text-sm); color: var(--muted); }

/* Maskottchen Zelli: eine Zelle, die sich mit deinen Punkten füllt */
.zelli { --w: 64px; position: relative; width: var(--w); height: var(--w); animation: idle 3.4s ease-in-out infinite; transform-origin: 50% 100%; }
.zelli.big { --w: 78px; }
.zelli.mini { --w: 46px; position: absolute; right: 16px; top: calc(var(--w) * -1.05); }
.zelli .body { position: absolute; inset: 0; border: 3px solid var(--line); border-radius: 46% 54% 50% 50% / 52% 48% 52% 48%; background: #f3f4ff; overflow: hidden; box-shadow: 0 4px 0 var(--line); }
.zelli .fill { position: absolute; left: 0; right: 0; bottom: 0; height: var(--lvl); background: var(--pop-cyan); transition: height 1s cubic-bezier(.3,.8,.3,1); }
.zelli .nuc { position: absolute; right: 16%; top: 14%; width: 22%; height: 22%; border-radius: 50%; background: var(--st-6); border: 2px solid var(--line); }
.zelli .face { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--w) * .08); padding-top: 10%; }
.zelli .eyes { display: flex; gap: calc(var(--w) * .18); }
.zelli .eye { display: block; width: calc(var(--w) * .12); height: calc(var(--w) * .17); background: var(--ink); border-radius: 50%; animation: blink 4.6s infinite; }
.zelli .mouth { display: block; width: calc(var(--w) * .28); height: calc(var(--w) * .13); border: 3px solid var(--ink); border-top: none; border-radius: 0 0 calc(var(--w) * .3) calc(var(--w) * .3); }
.zelli[data-mood="cheer"] .mouth { height: calc(var(--w) * .18); background: var(--ink); }
.zelli[data-mood="sad"] .mouth { border: 3px solid var(--ink); border-bottom: none; border-radius: calc(var(--w) * .3) calc(var(--w) * .3) 0 0; }
.zelli[data-mood="think"] .mouth { border: 0; border-bottom: 3px solid var(--ink); border-radius: 0; width: calc(var(--w) * .2); height: 0; }
.zelli[data-mood="cheer"] { animation: hop .65s ease-out 2; }
.zelli[data-mood="sad"] { animation: wobble .7s ease-in-out; }
.zelli.hop { animation: hop .65s ease-out; }

/* Animationen */
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes slideR { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
@keyframes slideL { from { opacity: 0; transform: translateX(-28px); } to { opacity: 1; transform: none; } }
@keyframes pop { 0% { opacity: 0; transform: scale(.94); } 60% { transform: scale(1.02); } 100% { opacity: 1; transform: none; } }
@keyframes shake { 0%,100% { transform: none; } 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
@keyframes pulse { 0% { transform: scale(1); } 40% { transform: scale(1.025); } 100% { transform: scale(1); } }
@keyframes starin { 0% { opacity: 0; transform: scale(.2) rotate(-40deg); } 70% { transform: scale(1.25) rotate(8deg); } 100% { opacity: 1; transform: none; } }
@keyframes fly { 0% { opacity: 1; transform: translate(0,0) rotate(0); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(var(--r)); } }
@keyframes bounceIn { 0% { opacity: 0; transform: translateY(26px) scale(.96); } 60% { opacity: 1; transform: translateY(-5px) scale(1.01); } 100% { opacity: 1; transform: none; } }
@keyframes idle { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes blink { 0%,92%,100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
@keyframes hop { 0% { transform: translateY(0) scale(1,1); } 30% { transform: translateY(-24px) scale(.94,1.1); } 62% { transform: translateY(0) scale(1.1,.9); } 100% { transform: none; } }
@keyframes wobble { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-10deg); } 75% { transform: rotate(10deg); } }
.view.enter { animation: rise .35s both; }
.view.enter .path > * { animation: rise .45s both; animation-delay: calc(var(--i, 0) * 60ms); }
.view.enter .qcard { animation: bounceIn .55s both; }
.lcard.fromR { animation: slideR .35s both; }
.lcard.fromL { animation: slideL .35s both; }
.view.noanim, .view.noanim * { animation: none !important; }

@media (min-width: 560px) {
  .st { grid-template-columns: 50px 1fr auto; grid-template-areas: "num body act"; align-items: center; }
  .acts { grid-template-columns: auto auto; }
  .acts .btn { min-width: 110px; }
  .lock { min-width: 130px; }
  .review { grid-template-columns: 1fr auto; align-items: center; }
  .review > .btn { width: auto; min-width: 150px; }
  .top h1 { font-size: 3.1rem; }
}
@media (max-width: 420px) { .tlrow, .tlscale { grid-template-columns: 7.2rem 1fr; } .top h1 { font-size: 2.2rem; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

/* ---------- Hilfsfunktionen ---------- */
let RNG = Math.random;
const rnd = a => a[Math.floor(RNG() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(RNG() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function seeded(str) {
  let h = 1779033703 ^ str.length;
  for (let i = 0; i < str.length; i++) { h = Math.imul(h ^ str.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  let a = (() => { h = Math.imul(h ^ (h >>> 16), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); return (h ^= h >>> 16) >>> 0; })();
  return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const esc = s => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');

function figHtml(k, mark, on) {
  const F = FIGS[k];
  let hs = '';
  F.list.forEach((o, i) => {
    if (mark === 'all') hs += `<g class="hs${on === i ? ' on' : ''}" data-hs="${i}" role="button" tabindex="0" aria-label="${esc(o.n)}"><circle cx="${o.x}" cy="${o.y}" r="15" fill="transparent"/><circle class="d" cx="${o.x}" cy="${o.y}" r="9"/><text x="${o.x}" y="${o.y}">${i + 1}</text></g>`;
    else if (mark === i) hs += `<g class="hs on"><circle class="ring" cx="${o.x}" cy="${o.y}" r="10"/><circle class="d" cx="${o.x}" cy="${o.y}" r="9"/><text x="${o.x}" y="${o.y}">?</text></g>`;
  });
  return `<svg class="fig" viewBox="${F.vb}" role="img" aria-label="${F.name}, vereinfachte Zeichnung">${F.svg}${hs}</svg>`;
}
function figItem(k) {
  const L = FIGS[k].list, i = Math.floor(RNG() * L.length), o = L[i];
  const wrong = shuffle(L.filter((_, j) => j !== i)).slice(0, 3).map(x => x.n);
  return mc('Wie heisst die markierte Stelle?', [o.n].concat(wrong), `<b>${o.n}:</b> ${o.f}`, figHtml(k, i));
}

    const fert = `<rect x="${xs(9)}" y="${top}" width="${xs(15) - xs(9)}" height="${shTop + shH - top}" fill="var(--good-bg)" opacity=".7"/>`;
    const per = preg ? '' : '';
    const curves = [['fsh', 'var(--c-fsh)'], ['lh', 'var(--c-lh)'], ['oe', 'var(--c-oe)'], ['pr', 'var(--c-pr)']].map(c => `<path class="curve" d="${path(x => ZY[c[0]](x, preg), top, H)}" stroke="${c[1]}"/>`).join('');
    let sh = `M${xs(1)},${shTop + shH}`; for (let d = 1; d <= 28; d += .25) sh += `L${xs(d).toFixed(1)},${(shTop + shH - ZY.sh(d, preg) * shH).toFixed(1)}`; sh += `L${xs(28)},${shTop + shH}Z`;
    const ticks = [1, 7, 14, 21, 28].map(d => `<text class="lbl" x="${xs(d)}" y="${shTop + shH + 14}" text-anchor="middle">${d}</text>`).join('');
    const svg = `<svg class="fig" viewBox="0 0 ${W} 200" role="img" aria-label="Hormonkurven und Schleimhaut im Zyklus, Tag ${day}">${fert}${per}
      <line class="axis" x1="${X0}" y1="${top + H}" x2="${X1}" y2="${top + H}"/><text class="lbl" x="2" y="${top + 8}">Hor-</text><text class="lbl" x="2" y="${top + 19}">mone</text>
      ${curves}<path d="${sh}" fill="var(--c-sh)" opacity=".75" stroke="var(--line)" stroke-width="1.5"/><text class="lbl" x="2" y="${shTop + 18}">Schl.-</text><text class="lbl" x="2" y="${shTop + 29}">haut</text>
      ${ticks}<line x1="${xs(day)}" y1="${top - 4}" x2="${xs(day)}" y2="${shTop + shH + 3}" stroke="var(--line)" stroke-width="2.5"/></svg>`;
    el.innerHTML = `<div class="sim"><div class="legend"><span style="--c:var(--c-fsh)">FSH</span><span style="--c:var(--c-lh)">LH</span><span style="--c:var(--c-oe)">Östrogen</span><span style="--c:var(--c-pr)">Progesteron</span><span style="--c:var(--c-sh)">Schleimhaut</span><span style="--c:#7fe0a0">fruchtbare Tage</span></div>
      ${svg}
      <div style="display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center"><div>${ovary(day)}<div class="small" style="text-align:center">Eierstock</div></div><p class="phase" style="margin:0;font-size:var(--text-sm)" aria-live="polite"><span class="mono">Tag ${day}</span><br>${phase(day)}</p></div>
      ${sl('day', 'Zyklustag', 1, 28, 1, day, '')}
      <div class="btnrow" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" id="zback">− 1 Tag</button><button class="btn sm" id="zfwd">+ 1 Tag</button><button class="btn sm" id="zplay">Abspielen</button></div>
      <label class="chk"><input type="checkbox" id="preg" ${preg ? 'checked' : ''}> Befruchtung findet statt</label>
      <p class="small">Vereinfachtes Modell eines 28-Tage-Zyklus. Kurven zeigen den Verlauf, keine echten Messwerte.</p></div>`;
    $id('dayv').textContent = day;
    $id('day').addEventListener('input', e => { day = +e.target.value; draw(); });
    $id('zback').addEventListener('click', () => { day = day > 1 ? day - 1 : 28; draw(); });
    $id('zfwd').addEventListener('click', () => { day = day < 28 ? day + 1 : 1; draw(); });
    $id('preg').addEventListener('change', e => { preg = e.target.checked; draw(); });
    $id('zplay').addEventListener('click', () => {
      if (el._t) { clearInterval(el._t); el._t = null; return; }
      day = 1; draw();
      el._t = setInterval(() => { if (!el.isConnected || day >= 28) { clearInterval(el._t); el._t = null; return; } day++; draw(); $id('zplay').textContent = 'Stopp'; }, reduced() ? 50 : 260);
    });
  }
  draw();
}

        <button class="btn sm" id="dice">20 Befruchtungen würfeln</button>
        ${n.m + n.w ? `<p class="readout mono">Mädchen (XX): ${n.w} · Jungen (XY): ${n.m}<br><span class="small">Ungefähr halb-halb, aber jedes Mal etwas anders: Zufall.</span></p>` : ''}</div>`;
      el.querySelectorAll('[data-c]').forEach(b => b.addEventListener('click', () => { last = b.dataset.c; draw(); }));
      $id('dice').addEventListener('click', () => { n = { m: 0, w: 0 }; for (let i = 0; i < 20; i++) Math.random() < .5 ? n.m++ : n.w++; draw(); });
    }
    draw();
  },
  rennen(el) {
    const H = [['Start: Samenerguss in die Scheide', 200e6], ['Saures Milieu der Scheide, viele defekte Spermien', 2e6], ['Schleimpfropf am Gebärmutterhals', 2e5], ['Abwehrzellen in der Gebärmutter', 1e4], ['Nur ein Eileiter hat eine Eizelle, Strömung im Eileiter', 100], ['Befruchtung: nur eines dringt ein', 1]];
    let i = 0;
    function draw() {
      const v = H[i][1], pct = Math.log10(v) / Math.log10(2e8) * 100;
      el.innerHTML = `<div class="sim"><div class="tag">Spermien unterwegs</div><div class="bigcount mono">${big(v)}</div>
        <span class="btrack"><span class="bfill" style="width:${Math.max(2, pct)}%"></span></span><p class="small">Balken mit gestauchter Skala</p>
        <ul class="hurdles">${H.map((h, j) => `<li class="${j === i ? 'cur' : j < i ? 'done' : ''}">${j <= i ? h[0] : '?'}</li>`).join('')}</ul>
        <div class="btnrow" style="display:flex;gap:8px;margin-top:12px"><button class="btn sm btn-primary" id="rn" ${i === H.length - 1 ? 'disabled' : ''}>Nächste Hürde</button><button class="btn sm" id="rr">Neu starten</button></div></div>`;
      $id('rn').addEventListener('click', () => { if (i < H.length - 1) { i++; draw(); } });
      $id('rr').addEventListener('click', () => { i = 0; draw(); });
    }
    draw();
  }
};

const lerp = (a, b, t) => a + (b - a) * Math.max(0, Math.min(1, t));
const seg = (t, a, b) => Math.max(0, Math.min(1, (t - a) / (b - a)));
// Zeitleiste mit Abspielen und Regler; draw(t, now) liefert SVG-Inhalt, stages = [[ab t, Text]]
function timeline(el, o) {
  let t = 0, playing = false, raf = 0, last = 0;
  el.innerHTML = `<div class="sim"><svg class="fig anim" viewBox="${o.vb}" role="img" aria-label="${esc(o.label)}"></svg>
    <p class="phase" aria-live="polite"></p>
    <label class="sl"><span class="sll">${o.slLabel || 'Ablauf'}: <b class="mono tv"></b></span><input type="range" min="0" max="1000" value="0"></label>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm btn-primary pl">Abspielen</button><button class="btn sm rs">Von vorne</button></div></div>`;
  const svg = el.querySelector('svg'), ph = el.querySelector('.phase'), rg = el.querySelector('input'), pl = el.querySelector('.pl'), tv = el.querySelector('.tv');
  function paint(now) {
    svg.innerHTML = o.draw(t, now || performance.now());
    let txt = o.stages[0][1]; o.stages.forEach(s => { if (t >= s[0]) txt = s[1]; });
    if (ph.dataset.txt !== txt) { ph.innerHTML = txt; ph.dataset.txt = txt; }
    rg.value = Math.round(t * 1000); tv.textContent = o.fmt ? o.fmt(t) : Math.round(t * 100) + ' %';
  }
  function loop(now) {
    if (!el.isConnected) return;
    if (playing) { t = Math.min(1, t + (now - last) / (o.dur * (reduced() ? .3 : 1))); if (t >= 1) { playing = false; pl.textContent = 'Abspielen'; } }
    last = now; paint(now); raf = requestAnimationFrame(loop);
  }
  pl.addEventListener('click', () => { if (t >= 1) t = 0; playing = !playing; pl.textContent = playing ? 'Pause' : 'Abspielen'; });
  el.querySelector('.rs').addEventListener('click', () => { t = 0; playing = true; pl.textContent = 'Pause'; });
  rg.addEventListener('input', () => { t = rg.value / 1000; playing = false; pl.textContent = 'Abspielen'; });
  last = performance.now(); paint(last); raf = requestAnimationFrame(loop);
}

  const tail = o.noTail ? '' : `<path d="${d}" fill="none" stroke="var(--line)" stroke-width="2" stroke-linecap="round" opacity="${o.tailOp == null ? 1 : o.tailOp}"/>`;
  return `${tail}<g opacity="${o.op == null ? 1 : o.op}"><ellipse cx="${x}" cy="${y}" rx="8" ry="5" fill="var(--organ4)" stroke="var(--line)" stroke-width="1.5"/><path d="M${x + 2},${y - 4.6} Q${x + 10},${y} ${x + 2},${y + 4.6}" fill="${o.cap || 'var(--pop-yellow)'}" stroke="var(--line)" stroke-width="1"/></g>`;

/* ---------- Rendern ---------- */
function countUp(el, to, pre, suf) {
  if (reduced()) { el.textContent = pre + to + suf; return; }
  const t0 = performance.now();
  (function step(t) { const p = Math.min(1, (t - t0) / 900); el.textContent = pre + Math.round(to * (1 - Math.pow(1 - p, 3))) + suf; if (p < 1) requestAnimationFrame(step); })(t0);
}
function render(mode) {
  const app = $id('app'); if (!app) return;
  const cls = mode === 'keep' ? ' noanim' : mode === 'fb' ? ' fbmode' : ' enter';
  ui.anim = cls === ' enter';
  const scr = !state.sex ? 'choose' : ui.screen;
  const html = scr === 'choose' ? viewChoose() : scr === 'home' ? viewHome() : scr === 'round' ? viewRound() : scr === 'summary' ? viewSummary() : scr === 'lesson' ? viewLesson() : viewLessonDone();
  app.innerHTML = `<div class="view${cls}">${html}</div>`;
  document.querySelectorAll('[data-count]').forEach(el => { const to = +el.dataset.count, pre = el.dataset.prefix || '', suf = el.dataset.suffix || ''; if (ui.anim) countUp(el, to, pre, suf); else el.textContent = pre + to + suf; });
  if (ui.anim) document.querySelectorAll('[data-w]').forEach(el => nextFrame(() => { el.style.width = el.dataset.w + '%'; }));
  if (scr === 'lesson') { const c = L.cards[L.i]; if (c.sim) { const host = $id('sim'); if (host && SIMS[c.sim]) SIMS[c.sim](host); } }
  if (scr === 'summary' && ui.anim && R && R.summary) { const s = R.summary; if ((R.mode === 'station' && s.stars === 3) || (R.mode === 'challenge' && s.c === 6) || s.levelUp) confetti(document.querySelector('.summary .card')); }
  if (mode === 'fb') { const el = document.querySelector('[data-act="next"]') || document.querySelector('.fb'); if (el && el.scrollIntoView) el.scrollIntoView({ block: 'end', behavior: 'smooth' }); return; }
  if (mode !== 'keep') window.scrollTo(0, 0);
}

/* ---------- Eingaben ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const a = b.dataset.act;
  if (a === 'sex') { state.sex = b.dataset.sex; state.introDone = false; save(); ui.screen = 'home'; render(); }
  else if (a === 'changesex') { state.sex = null; save(); render(); }
  else if (a === 'start') startRound(b.dataset.st);
  else if (a === 'review') startRound('review');
  else if (a === 'learn') startLesson(b.dataset.st);
  else if (a === 'lnext' || a === 'lprev') { const d = a === 'lnext' ? 1 : -1; L.i = Math.max(0, Math.min(L.cards.length - 1, L.i + d)); L.dir = d; render(); }
  else if (a === 'lopt') { if (L.sel[L.i] === undefined) { L.sel[L.i] = +b.dataset.i; render('fb'); } }
  else if (a === 'lfinish') finishLesson();
  else if (a === 'opt') answerOpt(+b.dataset.i);
  else if (a === 'ord') pickOrd(+b.dataset.i);
  else if (a === 'ordundo') { const q = R.queue[R.i]; q.picked.pop(); render('keep'); }
  else if (a === 'next') nextQ();
  else if (a === 'yt') { const box = $id('yt-' + b.dataset.id); if (box) box.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${b.dataset.id}?rel=0&autoplay=1" title="YouTube-Video" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`; }
  else if (a === 'explain') { const q = R.queue[R.i], m = modOf(q.tpl); startLesson(m.id, true); }
  else if (a === 'backround') { ui.screen = 'round'; render('keep'); window.scrollTo(0, 0); }
  else if (a === 'home') { ui.screen = 'home'; ui.gloss = false; render(); }
  else if (a === 'quit') { ui.screen = 'home'; R = null; render(); }
  else if (a === 'gloss') { ui.gloss = !ui.gloss; render('keep'); }
  else if (a === 'introdone') { state.introDone = true; save(); render('keep'); }
  else if (a === 'challenge') {
    const el = $id('chcode'), code = String(el ? el.value : ui.chCode).toUpperCase().replace(/[^A-Z0-9-]/g, '').slice(0, 20);
    ui.chCode = code;
    if (code.length < 3) { ui.chErr = 'Der Code braucht mindestens 3 Zeichen, zum Beispiel 8-ZYKL.'; render('keep'); return; }
    ui.chErr = ''; startRound('challenge', code);
  }
  else if (a === 'rcode') { const ch = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let c = '8-'; for (let i = 0; i < 4; i++) c += ch[Math.floor(Math.random() * ch.length)]; ui.chCode = c; ui.chErr = ''; render('keep'); }
  else if (a === 'nick') { state.nick = newNick(); save(); render('keep'); }
  else if (a === 'copy') { const line = R && R.summary && R.summary.ch ? R.summary.ch.line : ''; const say = ok => { const el = $id('copymsg'); if (el) el.textContent = ok ? 'Kopiert.' : 'Markiere den Text und kopiere ihn von Hand.'; }; try { navigator.clipboard.writeText(line).then(() => say(true), () => say(false)); } catch (err) { say(false); } }
  else if (a === 'poke') {
    const bub = $id('bubble'); if (bub) { bub.textContent = TIPS[tipI++ % TIPS.length]; bub.classList.remove('show'); void bub.offsetWidth; bub.classList.add('show'); }
    const z = document.querySelector('.hero .zelli'); if (z) { z.classList.remove('hop'); void z.offsetWidth; z.classList.add('hop'); }
  }
  else if (a === 'bkfile') downloadBackup();
  else if (a === 'bkcopy') {
    const code = exportCode();
    const ok = () => { ui.bkMsg = 'Code kopiert. Füge ihn zum Beispiel in eine Notiz oder E-Mail an dich selbst ein.'; ui.bkErr = ''; render('keep'); };
    const fail = () => { ui.bkOpen = true; ui.bkMsg = ''; ui.bkErr = 'Kopieren geht hier nicht automatisch. Der Code steht jetzt im Feld unten: markieren und von Hand kopieren.'; render('keep'); const t = $id('bkcode'); if (t) { t.value = code; t.select(); } };
    try { navigator.clipboard.writeText(code).then(ok, fail); } catch (err) { fail(); }
  }
  else if (a === 'bkload') { const f = $id('bkfile'); if (f) f.click(); }
  else if (a === 'bkpaste') { const t = $id('bkcode'); ui.bkOpen = true; applyImport(t ? t.value : ''); }
  else if (a === 'bkcancel') { ui.bkPending = null; ui.bkMsg = ''; render('keep'); }
  else if (a === 'bkapply') { if (ui.bkPending) { const d = ui.bkPending; delete d.savedAt; state = Object.assign(defaults(), d); save(); ui.bkPending = null; ui.bkOpen = false; ui.bkMsg = 'Lernstand geladen.'; ui.bkErr = ''; render(); } }
  else if (a === 'reset') { if (ui.confirmReset) { state = defaults(); save(); ui.confirmReset = false; } else ui.confirmReset = true; render('keep'); }
});
document.addEventListener('input', e => { if (e.target && e.target.id === 'chcode') ui.chCode = e.target.value; });
document.addEventListener('change', e => {
  if (!e.target || e.target.id !== 'bkfile' || !e.target.files || !e.target.files[0]) return;
  const r = new FileReader();
  r.onload = () => { const m = /PZ1\.[A-Za-z0-9+/=]+\.[a-z0-9]+/.exec(String(r.result)); applyImport(m ? m[0] : ''); };
  r.onerror = () => { ui.bkErr = 'Die Datei konnte nicht gelesen werden.'; render('keep'); };
  r.readAsText(e.target.files[0]);
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target && e.target.id === 'chcode') { e.preventDefault(); const b = document.querySelector('[data-act="challenge"]'); if (b) b.click(); } });

// Selbsttest: jede Aufgabenvorlage muss eine gültige Aufgabe liefern
Object.values(MODS).forEach(m => m.items.forEach(t => { for (let k = 0; k < 6; k++) { const d = t.make(); if (!d || !d.q || (d.type !== 'ord' && (!d.options || d.options.length < 2))) throw new Error('Aufgabe fehlerhaft: ' + t.id); } }));
if (typeof globalThis !== 'undefined') globalThis.__lernapp = { MODS, orderFor, ZY };
render();
})();
